
version: 1

applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22.22.2
            - nvm use 22.22.2
            - node -v
            - npm -v
            - npm ci
        build:
          commands:
            - npm run build

      artifacts:
        baseDirectory: dist
        files:
          - '**/*'

      cache:
        paths:
          - node_modules/**/*
